apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devopshub-ingress
  namespace: devopshub-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: devopshub.company.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devopshub-web-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: devopshub-api-service
                port:
                  number: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devopshub-api-hpa
  namespace: devopshub-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devopshub-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
