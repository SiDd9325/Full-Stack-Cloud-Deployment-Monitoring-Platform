apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopshub-api
  namespace: devopshub-prod
  labels:
    app: devopshub-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopshub-api
  template:
    metadata:
      labels:
        app: devopshub-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/devopshub-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: devopshub-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devopshub-api-service
  namespace: devopshub-prod
spec:
  type: ClusterIP
  selector:
    app: devopshub-api
  ports:
    - port: 4000
      targetPort: 4000
