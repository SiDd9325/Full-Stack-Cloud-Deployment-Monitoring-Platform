apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopshub-web
  namespace: devopshub-prod
  labels:
    app: devopshub-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devopshub-web
  template:
    metadata:
      labels:
        app: devopshub-web
    spec:
      containers:
        - name: web
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/devopshub-web:v1.0.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: devopshub-web-service
  namespace: devopshub-prod
spec:
  type: ClusterIP
  selector:
    app: devopshub-web
  ports:
    - port: 80
      targetPort: 80
